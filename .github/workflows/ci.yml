name: CI

on:
  push:
    branches:
      - main
      - fix/agentic-experiment-pipeline
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run backend tests
        run: pytest -q

  frontend:
    name: Frontend build and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Audit frontend dependencies (report only)
        run: |
          npm audit --json > /tmp/npm-audit.json || true
          node -e "const audit=require('/tmp/npm-audit.json'); console.log('Vulnerability summary:', audit.metadata?.vulnerabilities ?? 'unavailable'); for (const [name, item] of Object.entries(audit.vulnerabilities ?? {})) console.log(name + ': severity=' + item.severity + ', direct=' + item.isDirect + ', range=' + item.range + ', fixAvailable=' + JSON.stringify(item.fixAvailable));"
      - name: Build frontend
        run: npm run build
      - name: Run frontend tests
        run: npm test
