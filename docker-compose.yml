services:
  backend:
    build: ./backend
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: sqlite:///./agentic.db
      SIMULATION_MODE: "true"
      CORS_ORIGINS: http://localhost:5173
    volumes: ["./data:/app"]
  frontend:
    build: ./frontend
    ports: ["5173:80"]
    depends_on: [backend]
